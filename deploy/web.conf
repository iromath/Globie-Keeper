# Static host for the Expo web export (DEV_PLAN §2.15).
# Served at the root of keeper.globie.ai; the API lives on keeperapi.globie.ai.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed bundles never change under the same name.
    location /_expo/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Client-side routes: /groups/abc and friends all boot the SPA.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
