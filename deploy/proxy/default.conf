# Single-origin hosting (DEV_PLAN §2.15).
#
#   /api/  -> api:3001 (Fastify already mounts everything under /api)
#   /      -> web:80   (Expo export, SPA fallback in deploy/web.conf)
#
# Production splits the two across separate hostnames
# (keeper.globie.ai -> web, keeperapi.globie.ai -> api), so this file is the
# one-domain fallback and the shape to copy if you front the pair with a proxy.
#
# TLS lives in /etc/nginx/tls/*.conf (see https.conf.example); this file is
# http-only so a tunnel or an upstream terminator can front it unchanged.

server {
    listen 80;
    server_name _;

    client_max_body_size 110m;

    location /api/ {
        proxy_pass http://api:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Receipt uploads and vision calls run longer than nginx's 60s default.
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://web:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Container/orchestrator probe; not part of the public surface.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}

# Dropped in when deploy/certs has a certificate; empty directory -> no-op.
include /etc/nginx/tls/*.conf;
